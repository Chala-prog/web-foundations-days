<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory & Library API</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
      color: #1a202c;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (min-width: 480px) {
      .controls {
        flex-direction: row;
        align-items: flex-end;
      }
    }
    .field-group {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #4a5568;
    }
    input[type="text"] {
      padding: 0.6rem 0.8rem;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      padding: 0.618rem 1.25rem;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover:not(:disabled) {
      background-color: #2b6cb0;
    }
    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    #status {
      font-weight: 500;
      margin-bottom: 1rem;
      min-height: 1.5rem;
    }
    #status.error {
      color: #e53e3e;
    }
    #status.loading {
      color: #d69e2e;
    }
    #status.success {
      color: #38a169;
    }
    #users-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .user-card {
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #3182ce;
      border-radius: 4px;
      background-color: #f8fafc;
    }
    .user-card h3 {
      font-size: 1.1rem;
      color: #2d3748;
      margin-bottom: 0.25rem;
    }
    .user-card p {
      font-size: 0.9rem;
      color: #4a5568;
    }
    .no-results {
      padding: 1rem;
      text-align: center;
      color: #718096;
      font-style: italic;
    }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>User Directory</h1>
    
    <div class="controls">
      <button id="load-users">Load Users</button>
      <div class="field-group">
        <label for="filter-input">Filter by name:</label>
        <input type="text" id="filter-input" placeholder="Type a name..." disabled>
      </div>
    </div>

    <p id="status"></p>
    <ul id="users-list"></ul>
  </div>
</body>
</html>
